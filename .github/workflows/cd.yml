name: CD Pipeline - Production Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Production Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Linting & Static Analysis
        run: npm run lint

      - name: Backend Typecheck
        run: npm --workspace=backend run typecheck

      - name: Backend Automated Test Suites
        run: npm --workspace=backend test -- --coverage

      - name: Frontend Automated Test Suites
        run: npm --workspace=frontend test -- --run

      - name: Frontend Production Bundle Build
        run: npm run build:frontend

      - name: Archive Production Frontend Bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-production
          path: frontend/dist
          retention-days: 14

  docker-build:
    name: Docker Production Images Build & Verification
    runs-on: ubuntu-latest
    needs: [release-gate]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: dsa-tracker-backend:${{ github.sha }}

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: dsa-tracker-frontend:${{ github.sha }}

  github-release:
    name: Publish GitHub Production Release
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Frontend Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-production
          path: dist

      - name: Package Release Archive
        run: |
          tar -czf dsa-tracker-frontend-v1.0.0.tar.gz -C dist .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dsa-tracker-frontend-v1.0.0.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
          name: Release ${{ github.ref_name }}
