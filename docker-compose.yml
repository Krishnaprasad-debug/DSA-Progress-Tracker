version: '3.8'

services:
  mongodb:
    image: mongo:6-jammy
    container_name: dsa-tracker-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: dsa-progress-tracker
    volumes:
      - mongodb_data:/data/db
    networks:
      - dsa-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsa-tracker-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:5173
      MONGODB_URI: mongodb://mongodb:27017/dsa-progress-tracker
      JWT_SECRET: production_jwt_secret_dsa_tracker_32_characters_long
      JWT_EXPIRES_IN: 7d
      COOKIE_SECRET: production_cookie_secret_dsa_tracker_signing
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - dsa-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:5000/api/health']
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dsa-tracker-frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dsa-network

volumes:
  mongodb_data:
    driver: local

networks:
  dsa-network:
    driver: bridge
