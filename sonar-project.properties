# SonarCloud Project Configuration
sonar.projectKey=Krishnaprasad-debug_DSA-Progress-Tracker
sonar.organization=krishnaprasad-debug

# Source and Encoding Configuration
sonar.sourceEncoding=UTF-8

# Source and Test Paths
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src/test

# Inclusions & Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.d.ts,**/*.config.js,**/*.config.ts
sonar.test.inclusions=backend/tests/**/*.ts,frontend/src/test/**/*.{ts,tsx}

# Coverage & Test Execution Reports
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Quality Gate Settings
sonar.qualitygate.wait=false
